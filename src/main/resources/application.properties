# Server Configuration
server.port=8081

# Application Identity
spring.application.name=roster-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/roster_db
spring.datasource.username=commander
spring.datasource.password=outpost_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/nikke-ark
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/realms/nikke-ark/protocol/openid-connect/certs