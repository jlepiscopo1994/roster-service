services:
  keycloak-iam:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: nikke-keycloak
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8085
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8085:8085"
    volumes:
      # Mount the json config file into the Keycloak import directory
      - ./src/main/resources/auth/nikke-realm.json:/opt/keycloak/data/import/nikke-realm.json:ro
    restart: unless-stopped